[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geodata-kit-postal"
version = "0.1.0"
description = "Optional data for geodata-kit: postal code → place and place → postal codes for 124 countries (GeoNames)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/geodata_kit_postal"]
