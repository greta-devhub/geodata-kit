[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geodata-kit-localities"
version = "0.1.0"
description = "Optional data for geodata-kit: 4.9 million villages, hamlets and city districts from GeoNames, sharded per country."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Homepage = "https://github.com/greta-devhub/geodata-kit"
Repository = "https://github.com/greta-devhub/geodata-kit"
Issues = "https://github.com/greta-devhub/geodata-kit/issues"
Changelog = "https://github.com/greta-devhub/geodata-kit/releases"
Documentation = "https://github.com/greta-devhub/geodata-kit/tree/main/python/extras/geodata_kit_localities#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/geodata_kit_localities"]
