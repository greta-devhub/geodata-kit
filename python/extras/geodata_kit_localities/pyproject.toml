[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "geodata-kit-localities"
version = "0.1.0"
description = "Optional data for geodata-kit: 4.9 million villages, hamlets and city districts from GeoNames, sharded per country."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/geodata_kit_localities"]
